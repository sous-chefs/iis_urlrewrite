driver:
  name: vagrant
  customize:
    cpus: 2
    memory: 4096

transport:
  name: winrm
  elevated: true

provisioner:
  name: policyfile_zero
  policyfile: Policyfile.rb
  deprecations_as_errors: true

platforms:
  - name: windows-2008r2
    driver_config:
      box: tas50/windows_2008r2
  - name: windows-2012r2
    driver_config:
      box: tas50/windows_2012r2

suites:
  - name: default
    provisioner:
      named_run_list: default
